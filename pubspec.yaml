name: revela
description: Aplicación móvil para administrar el centro de belleza Revela.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  http: ^1.6.0
  intl: ^0.20.3
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - recursos/imagenes/
    - recursos/iconos/
  fonts:
    - family: Inter
      fonts:
        - asset: recursos/fuentes/Inter.ttf
          weight: 100
        - asset: recursos/fuentes/Inter.ttf
          weight: 900
    - family: OpenSans
      fonts:
        - asset: recursos/fuentes/OpenSans.ttf
          weight: 600
